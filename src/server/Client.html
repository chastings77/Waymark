<script>
(() => {
'use strict';

const SESSION_KEY = 'waymark.application-session.v3';
const state = { hunts: [], selected: new Set(), sessionIds: [], currentIndex: 0, sessionStarted: false, saving: false, sessionResults: {} };
const $ = id => document.getElementById(id);
const el = {
  syncMessage: $('syncMessage'), selectionView: $('selectionView'), wizardView: $('wizardView'), completeView: $('completeView'),
  huntRows: $('huntRows'), selectAll: $('selectAll'), searchInput: $('searchInput'), applicantFilter: $('applicantFilter'),
  priorityFilter: $('priorityFilter'), statusFilter: $('statusFilter'), sortSelect: $('sortSelect'), resultCount: $('resultCount'),
  selectedCount: $('selectedCount'), selectedCost: $('selectedCost'), startButton: $('startButton'), resetButton: $('resetButton'),
  wizardProgress: $('wizardProgress'), wizardProgressBar: $('wizardProgressBar'), wizardApplicant: $('wizardApplicant'),
  wizardTitle: $('wizardTitle'), wizardSubtitle: $('wizardSubtitle'), wizardDeadline: $('wizardDeadline'), detailPriority: $('detailPriority'),
  detailFee: $('detailFee'), detailRow: $('detailRow'), wizardNotes: $('wizardNotes'), detailsLink: $('detailsLink'),
  applyLink: $('applyLink'), confirmationInput: $('confirmationInput'), dateAppliedInput: $('dateAppliedInput'), saveMessage: $('saveMessage'),
  backButton: $('backButton'), previousButton: $('previousButton'), skipButton: $('skipButton'), appliedButton: $('appliedButton'),
  completeSummary: $('completeSummary'), completeList: $('completeList'), downloadCsvButton: $('downloadCsvButton'), returnButton: $('returnButton')
};

const today = () => new Date().toLocaleDateString('en-CA');
const money = value => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(Number(value) || 0);
const escapeHtml = value => String(value ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
const priorityRank = value => ({ A: 1, B: 2, C: 3 }[value] || 9);
const deadlineKey = value => /^\d{4}-\d{2}-\d{2}$/.test(value || '') ? value : '9999-12-31';

function dateText(value) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(value || '')) return value || 'No deadline';
  return new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric', year: 'numeric' }).format(new Date(`${value}T12:00:00`));
}

function setSync(message, type = '') {
  el.syncMessage.textContent = message;
  el.syncMessage.className = `sync-message ${type}`.trim();
  el.syncMessage.hidden = !message;
}

function setSaveMessage(message, type = '') {
  el.saveMessage.textContent = message;
  el.saveMessage.className = `save-message ${type}`.trim();
}

function callServer(functionName, argument) {
  return new Promise((resolve, reject) => {
    let runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(error => reject(new Error(error?.message || String(error))));
    if (argument === undefined) runner[functionName]();
    else runner[functionName](argument);
  });
}

async function loadFromSpreadsheet({ preserveSelection = false } = {}) {
  const selectedIds = preserveSelection ? new Set(state.selected) : new Set();
  setSync('Loading Master Hunt List…');
  el.selectionView.hidden = true;
  try {
    const hunts = await callServer('getHunts');
    state.hunts = Array.isArray(hunts) ? hunts : [];
    state.selected = new Set([...selectedIds].filter(id => state.hunts.some(h => h.huntId === id)));
    setSync(`Connected to the spreadsheet · ${state.hunts.length} application records loaded.`, 'success');
    show('selection');
    renderList();
    if (loadSession()) { show('wizard'); renderWizard(); }
  } catch (error) {
    setSync(`Could not load the spreadsheet: ${error.message}`, 'error');
  }
}

function saveSession() {
  if (state.sessionStarted && state.sessionIds.length) {
    sessionStorage.setItem(SESSION_KEY, JSON.stringify({ sessionIds: state.sessionIds, currentIndex: state.currentIndex, sessionResults: state.sessionResults }));
  }
}

function loadSession() {
  try {
    const saved = JSON.parse(sessionStorage.getItem(SESSION_KEY));
    if (!saved?.sessionIds?.length) return false;
    state.sessionIds = saved.sessionIds.filter(id => state.hunts.some(h => h.huntId === id));
    if (!state.sessionIds.length) return false;
    state.currentIndex = Math.min(Math.max(Number(saved.currentIndex) || 0, 0), state.sessionIds.length - 1);
    state.sessionResults = saved.sessionResults && typeof saved.sessionResults === 'object' ? saved.sessionResults : {};
    state.sessionStarted = true;
    return true;
  } catch { return false; }
}

function clearSession() { sessionStorage.removeItem(SESSION_KEY); state.sessionStarted = false; state.sessionResults = {}; }
function currentHunt() { return state.hunts.find(h => h.huntId === state.sessionIds[state.currentIndex]); }

function filteredHunts() {
  let hunts = [...state.hunts];
  const query = el.searchInput.value.trim().toLowerCase();
  if (query) hunts = hunts.filter(h => [h.huntArea, h.speciesGroup, h.huntCategory, h.region, h.notes, h.priorityReason].some(v => String(v || '').toLowerCase().includes(query)));
  if (el.applicantFilter.value !== 'all') hunts = hunts.filter(h => h.applicant === el.applicantFilter.value);
  if (el.priorityFilter.value !== 'all') hunts = hunts.filter(h => h.priority === el.priorityFilter.value);
  if (el.statusFilter.value !== 'all') hunts = hunts.filter(h => h.applicationStatus === el.statusFilter.value);
  const sort = el.sortSelect.value;
  hunts.sort((a, b) => {
    if (sort === 'priority') return priorityRank(a.priority) - priorityRank(b.priority) || deadlineKey(a.applicationDeadline).localeCompare(deadlineKey(b.applicationDeadline)) || a.huntArea.localeCompare(b.huntArea);
    if (sort === 'area') return a.huntArea.localeCompare(b.huntArea) || a.applicant.localeCompare(b.applicant);
    if (sort === 'species') return a.speciesGroup.localeCompare(b.speciesGroup) || a.huntArea.localeCompare(b.huntArea) || a.applicant.localeCompare(b.applicant);
    if (sort === 'applicant') return a.applicant.localeCompare(b.applicant) || deadlineKey(a.applicationDeadline).localeCompare(deadlineKey(b.applicationDeadline));
    return deadlineKey(a.applicationDeadline).localeCompare(deadlineKey(b.applicationDeadline)) || priorityRank(a.priority) - priorityRank(b.priority) || a.huntArea.localeCompare(b.huntArea) || a.applicant.localeCompare(b.applicant);
  });
  return hunts;
}

function renderList() {
  const hunts = filteredHunts();
  el.resultCount.textContent = hunts.length;
  el.huntRows.innerHTML = hunts.map(h => `<tr class="${state.selected.has(h.huntId) ? 'selected-row' : ''}">
    <td><input class="hunt-check" type="checkbox" data-id="${escapeHtml(h.huntId)}" ${state.selected.has(h.huntId) ? 'checked' : ''}></td>
    <td><strong>${escapeHtml(dateText(h.applicationDeadline))}</strong></td>
    <td><span class="priority-chip priority-${escapeHtml(String(h.priority).toLowerCase())}">${escapeHtml(h.priority)}</span></td>
    <td><strong>${escapeHtml(h.applicant)}</strong><span class="${h.applicantType === 'Youth' ? 'youth-chip' : 'adult-chip'}">${escapeHtml(h.applicantType)}</span></td>
    <td><strong>${escapeHtml(h.huntArea)}</strong><br><span class="muted">${escapeHtml(h.region)}</span></td>
    <td><strong>${escapeHtml(h.speciesGroup)}</strong><br><span class="muted">${escapeHtml(h.huntCategory)}</span></td>
    <td>${escapeHtml(money(h.applicationFee))}</td>
    <td><span class="status-chip status-${String(h.applicationStatus).toLowerCase().replaceAll(' ', '-')}">${escapeHtml(h.applicationStatus)}</span>${h.dateApplied ? `<br><span class="muted">${escapeHtml(dateText(h.dateApplied))}</span>` : ''}</td>
  </tr>`).join('');

  document.querySelectorAll('.hunt-check').forEach(box => box.addEventListener('change', event => {
    event.target.checked ? state.selected.add(event.target.dataset.id) : state.selected.delete(event.target.dataset.id);
    renderList();
  }));

  const selected = state.hunts.filter(h => state.selected.has(h.huntId));
  el.selectedCount.textContent = `${selected.length} selected`;
  el.selectedCost.textContent = ` · ${money(selected.reduce((sum, h) => sum + Number(h.applicationFee || 0), 0))} total fees`;
  el.startButton.disabled = !selected.length;
  el.selectAll.checked = hunts.length > 0 && hunts.every(h => state.selected.has(h.huntId));
  el.selectAll.indeterminate = hunts.some(h => state.selected.has(h.huntId)) && !el.selectAll.checked;
}

function startSession() {
  state.sessionIds = filteredHunts().filter(h => state.selected.has(h.huntId)).map(h => h.huntId);
  if (!state.sessionIds.length) return;
  state.currentIndex = 0;
  state.sessionResults = {};
  state.sessionStarted = true;
  saveSession();
  show('wizard');
  renderWizard();
}

function preserveDraft() {
  const hunt = currentHunt();
  if (!hunt) return;
  hunt.confirmationNumber = el.confirmationInput.value.trim();
  hunt.dateApplied = el.dateAppliedInput.value || hunt.dateApplied || '';
}

function renderWizard() {
  const hunt = currentHunt();
  if (!hunt) return finishSession();
  const total = state.sessionIds.length;
  el.wizardProgress.textContent = `${state.currentIndex + 1} of ${total}`;
  el.wizardProgressBar.max = total;
  el.wizardProgressBar.value = state.currentIndex + 1;
  el.wizardApplicant.textContent = `${hunt.applicantType} · ${hunt.applicant}`;
  el.wizardTitle.textContent = hunt.huntArea;
  el.wizardSubtitle.textContent = `${hunt.speciesGroup} · ${hunt.huntCategory}`;
  el.wizardDeadline.textContent = `Due ${dateText(hunt.applicationDeadline)}`;
  el.detailPriority.textContent = hunt.priority;
  el.detailFee.textContent = money(hunt.applicationFee);
  el.detailRow.textContent = hunt.sourceRow;
  el.wizardNotes.textContent = hunt.notes || hunt.priorityReason || 'No notes.';
  el.detailsLink.href = hunt.areaDetailsUrl || hunt.officialDetailsUrl || '#';
  el.applyLink.href = hunt.applyPortalUrl || hunt.officialDetailsUrl || '#';
  el.confirmationInput.value = hunt.confirmationNumber || '';
  el.dateAppliedInput.value = hunt.dateApplied || today();
  el.previousButton.disabled = state.currentIndex === 0 || state.saving;
  setSaveMessage('');
  saveSession();
}

function setSaving(saving) {
  state.saving = saving;
  [el.appliedButton, el.skipButton, el.previousButton, el.backButton].forEach(button => button.disabled = saving || (button === el.previousButton && state.currentIndex === 0));
  el.appliedButton.textContent = saving ? 'Saving…' : 'Save Applied & Next';
}

async function persistCurrent(status) {
  const hunt = currentHunt();
  if (!hunt || state.saving) return;
  const payload = {
    huntId: hunt.huntId,
    sourceRow: hunt.sourceRow,
    applicant: hunt.applicant,
    status,
    dateApplied: status === 'Applied' ? (el.dateAppliedInput.value || today()) : '',
    confirmationNumber: el.confirmationInput.value.trim()
  };

  setSaving(true);
  setSaveMessage(`Saving ${hunt.applicant}'s ${hunt.huntArea} record to Google Sheets…`);
  try {
    const receipt = await callServer('saveApplication', payload);
    if (!receipt || receipt.ok !== true || !receipt.hunt) {
      throw new Error('Google Sheets did not return a confirmed save receipt.');
    }
    const updated = receipt.hunt;
    if (updated.huntId !== payload.huntId || Number(updated.sourceRow) !== Number(payload.sourceRow) || updated.applicant !== payload.applicant || updated.applicationStatus !== status) {
      throw new Error('The saved row did not match the application being processed.');
    }
    const index = state.hunts.findIndex(item => item.huntId === updated.huntId);
    if (index < 0) throw new Error('The saved application could not be matched in the current session.');
    state.hunts[index] = updated;
    state.sessionResults[updated.huntId] = {
      ok: true,
      status: updated.applicationStatus,
      savedAt: receipt.savedAt,
      sourceRow: updated.sourceRow,
      applicant: updated.applicant
    };
    if (status === 'Applied') state.selected.delete(updated.huntId);
    saveSession();
    setSaveMessage(`Confirmed in Google Sheets · row ${updated.sourceRow}.`, 'success');
    next();
  } catch (error) {
    setSaveMessage(`Not saved: ${error.message}`, 'error');
  } finally {
    setSaving(false);
  }
}

function previous() {
  if (!state.currentIndex || state.saving) return;
  preserveDraft();
  state.currentIndex--;
  saveSession();
  renderWizard();
}

function next() {
  state.currentIndex++;
  saveSession();
  state.currentIndex >= state.sessionIds.length ? finishSession() : renderWizard();
}

function finishSession() {
  show('complete');
  const session = state.sessionIds.map(id => state.hunts.find(h => h.huntId === id)).filter(Boolean);
  const confirmed = session.filter(h => state.sessionResults[h.huntId]?.ok === true);
  if (confirmed.length !== session.length) {
    const firstUnconfirmedIndex = state.sessionIds.findIndex(id => !state.sessionResults[id]?.ok);
    state.currentIndex = firstUnconfirmedIndex < 0 ? 0 : firstUnconfirmedIndex;
    show('wizard');
    renderWizard();
    setSaveMessage('This session is not complete. This record still needs a confirmed Google Sheets save.', 'error');
    return;
  }
  const applied = session.filter(h => h.applicationStatus === 'Applied');
  const skipped = session.filter(h => h.applicationStatus === 'Skipped');
  el.completeSummary.textContent = `${applied.length} applied${skipped.length ? ` · ${skipped.length} skipped` : ''} · ${session.length} total. All ${session.length} records were confirmed by Google Sheets.`;
  el.completeList.innerHTML = session.map(h => `<div><strong>✓ ${escapeHtml(h.applicant)} — ${escapeHtml(h.huntArea)}</strong><span>${escapeHtml(h.speciesGroup)} · ${escapeHtml(h.applicationStatus)} · Sheet row ${escapeHtml(h.sourceRow)}${h.dateApplied ? ` · ${escapeHtml(dateText(h.dateApplied))}` : ''}</span></div>`).join('');
  clearSession();
}

function show(view) {
  el.selectionView.hidden = view !== 'selection';
  el.wizardView.hidden = view !== 'wizard';
  el.completeView.hidden = view !== 'complete';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function downloadCsv() {
  const rows = [['Master List Row', 'Hunt ID', 'Applicant(s)', 'Hunt Area', 'Species Group', 'Hunt Category', 'Applied', 'Date Applied', 'TPWD Confirmation #']];
  state.hunts.filter(h => state.sessionIds.includes(h.huntId)).forEach(h => rows.push([h.sourceRow, h.huntId, h.applicant, h.huntArea, h.speciesGroup, h.huntCategory, h.applicationStatus === 'Applied' ? 'Yes' : 'No', h.dateApplied || '', h.confirmationNumber || '']));
  const csv = rows.map(row => row.map(value => `"${String(value ?? '').replaceAll('"', '""')}"`).join(',')).join('\n');
  const anchor = document.createElement('a');
  anchor.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  anchor.download = `waymark-application-session-${today()}.csv`;
  anchor.click();
  URL.revokeObjectURL(anchor.href);
}

[el.searchInput, el.applicantFilter, el.priorityFilter, el.statusFilter, el.sortSelect].forEach(input => input.addEventListener(input === el.searchInput ? 'input' : 'change', renderList));
el.selectAll.addEventListener('change', () => { filteredHunts().forEach(h => el.selectAll.checked ? state.selected.add(h.huntId) : state.selected.delete(h.huntId)); renderList(); });
el.startButton.addEventListener('click', startSession);
el.backButton.addEventListener('click', () => { preserveDraft(); show('selection'); renderList(); });
el.previousButton.addEventListener('click', previous);
el.appliedButton.addEventListener('click', () => persistCurrent('Applied'));
el.skipButton.addEventListener('click', () => persistCurrent('Skipped'));
el.returnButton.addEventListener('click', async () => { state.sessionIds = []; state.currentIndex = 0; await loadFromSpreadsheet(); });
el.downloadCsvButton.addEventListener('click', downloadCsv);
el.resetButton.addEventListener('click', () => loadFromSpreadsheet({ preserveSelection: true }));

loadFromSpreadsheet();
})();
</script>
